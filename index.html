<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora web hecha con HTML, CSS y JavaScript vanilla.">
    <title>Calculadora</title>
    <!-- logo-->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 384 512'%3E%3Cpath fill='%23ff7033' d='M64 0C28.7 0 0 28.7 0 64L0 448c0 35.3 28.7 64 64 64l256 0c35.3 0 64-28.7 64-64l0-384c0-35.3-28.7-64-64-64L64 0zM96 64l192 0c17.7 0 32 14.3 32 32l0 32c0 17.7-14.3 32-32 32L96 160c-17.7 0-32-14.3-32-32l0-32c0-17.7 14.3-32 32-32zm32 160a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM96 352a32 32 0 1 1 0-64 32 32 0 1 1 0 64zM64 416c0-17.7 14.3-32 32-32l96 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-96 0c-17.7 0-32-14.3-32-32zM192 256a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zm64-64a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM288 448a32 32 0 1 1 0-64 32 32 0 1 1 0 64z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="stage">
        <section class="calculator" aria-label="Calculadora">

            <output class="calculator__display" for="calculator__keys" data-display aria-live="polite">0</output>

           
            <div class="calculator__keys" id="calculator__keys" role="group" aria-label="Teclado de la calculadora">

                <button type="button" class="key--operator" data-action="add" aria-label="Sumar">+</button>
                <button type="button" class="key--operator" data-action="subtract" aria-label="Restar">&minus;</button>
                <button type="button" class="key--operator" data-action="multiply" aria-label="Multiplicar">&times;</button>
                <button type="button" class="key--operator" data-action="divide" aria-label="Dividir">&divide;</button>

                <button type="button">7</button>
                <button type="button">8</button>
                <button type="button">9</button>

                <button type="button">4</button>
                <button type="button">5</button>
                <button type="button">6</button>

                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>

                <button type="button">0</button>
                <button type="button" data-action="decimal">.</button>
                <button type="button" data-action="clear">AC</button>

                <button type="button" class="key--equal" data-action="calculate" aria-label="Igual">=</button>

            </div>

        </section>
    </main>

    <script src="js/calculator.js"></script>
</body>
</html>
